<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 740" width="100%" height="100%" style="background:#ffffff; font-family:'Segoe UI', Arial, sans-serif;">
  <defs>
    <!-- Arrowhead pointing right (for main spine) -->
    <marker id="arrow-spine" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#000000"/>
    </marker>
    <!-- Small arrowhead pointing towards diagonal bone -->
    <marker id="arrow-sub" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 2 L 8 5 L 0 8 z" fill="#000000"/>
    </marker>
    <!-- Arrowhead at intersection with spine -->
    <marker id="arrow-bone" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#000000"/>
    </marker>
  </defs>

  <!-- ==================== CENTRAL SPINE ==================== -->
  <line x1="40" y1="370" x2="960" y2="370" stroke="#000000" stroke-width="3" marker-end="url(#arrow-spine)"/>

  <!-- ==================== 1. MANPOWER (TOP-LEFT) ==================== -->
  <g>
    <!-- Rectangular Box -->
    <rect x="130" y="55" width="150" height="38" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
    <text x="205" y="79" font-size="14" font-weight="700" fill="#000000" text-anchor="middle">Manpower</text>
    
    <!-- Diagonal Main Bone -->
    <line x1="205" y1="93" x2="350" y2="370" stroke="#000000" stroke-width="2.5" marker-end="url(#arrow-bone)"/>

    <!-- Sub-branches (Horizontal lines with arrowheads pointing right into bone) -->
    <line x1="45" y1="140" x2="228" y2="140" stroke="#000000" stroke-width="1.4" marker-end="url(#arrow-sub)"/>
    <text x="50" y="133" font-size="11" font-weight="500" fill="#000000">Limited awareness of air pollution</text>

    <line x1="70" y1="195" x2="257" y2="195" stroke="#000000" stroke-width="1.4" marker-end="url(#arrow-sub)"/>
    <text x="75" y="188" font-size="11" font-weight="500" fill="#000000">Lack of trained environmental personnel</text>

    <line x1="90" y1="250" x2="286" y2="250" stroke="#000000" stroke-width="1.4" marker-end="url(#arrow-sub)"/>
    <text x="95" y="243" font-size="11" font-weight="500" fill="#000000">Limited technical IoT &amp; AI knowledge</text>

    <line x1="110" y1="305" x2="315" y2="305" stroke="#000000" stroke-width="1.4" marker-end="url(#arrow-sub)"/>
    <text x="115" y="298" font-size="11" font-weight="500" fill="#000000">Low community participation &amp; reporting</text>
  </g>

  <!-- ==================== 2. METHOD (TOP-MIDDLE) ==================== -->
  <g>
    <!-- Rectangular Box -->
    <rect x="430" y="55" width="150" height="38" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
    <text x="505" y="79" font-size="14" font-weight="700" fill="#000000" text-anchor="middle">Method</text>
    
    <!-- Diagonal Main Bone -->
    <line x1="505" y1="93" x2="650" y2="370" stroke="#000000" stroke-width="2.5" marker-end="url(#arrow-bone)"/>

    <!-- Sub-branches -->
    <line x1="345" y1="140" x2="528" y2="140" stroke="#000000" stroke-width="1.4" marker-end="url(#arrow-sub)"/>
    <text x="350" y="133" font-size="11" font-weight="500" fill="#000000">Periodic, manual air quality monitoring</text>

    <line x1="370" y1="195" x2="557" y2="195" stroke="#000000" stroke-width="1.4" marker-end="url(#arrow-sub)"/>
    <text x="375" y="188" font-size="11" font-weight="500" fill="#000000">Delayed data collection &amp; reporting</text>

    <line x1="390" y1="250" x2="586" y2="250" stroke="#000000" stroke-width="1.4" marker-end="url(#arrow-sub)"/>
    <text x="395" y="243" font-size="11" font-weight="500" fill="#000000">No automated predictive forecasting</text>

    <line x1="410" y1="305" x2="615" y2="305" stroke="#000000" stroke-width="1.4" marker-end="url(#arrow-sub)"/>
    <text x="415" y="298" font-size="11" font-weight="500" fill="#000000">No standardized public health warning alerts</text>
  </g>

  <!-- ==================== 3. MACHINE (TOP-RIGHT) ==================== -->
  <g>
    <!-- Rectangular Box -->
    <rect x="730" y="55" width="150" height="38" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
    <text x="805" y="79" font-size="14" font-weight="700" fill="#000000" text-anchor="middle">Machine</text>
    
    <!-- Diagonal Main Bone -->
    <line x1="805" y1="93" x2="930" y2="370" stroke="#000000" stroke-width="2.5" marker-end="url(#arrow-bone)"/>

    <!-- Sub-branches -->
    <line x1="645" y1="140" x2="825" y2="140" stroke="#000000" stroke-width="1.4" marker-end="url(#arrow-sub)"/>
    <text x="650" y="133" font-size="11" font-weight="500" fill="#000000">Zero regional DENR reference stations</text>

    <line x1="670" y1="195" x2="850" y2="195" stroke="#000000" stroke-width="1.4" marker-end="url(#arrow-sub)"/>
    <text x="675" y="188" font-size="11" font-weight="500" fill="#000000">Prohibitive cost of commercial analyzers</text>

    <line x1="695" y1="250" x2="875" y2="250" stroke="#000000" stroke-width="1.4" marker-end="url(#arrow-sub)"/>
    <text x="700" y="243" font-size="11" font-weight="500" fill="#000000">Intermittent bridge Wi-Fi/cellular network</text>

    <line x1="720" y1="305" x2="900" y2="305" stroke="#000000" stroke-width="1.4" marker-end="url(#arrow-sub)"/>
    <text x="725" y="298" font-size="11" font-weight="500" fill="#000000">Outdoor power instability on bridge</text>
  </g>

  <!-- ==================== 4. MATERIAL (BOTTOM-LEFT) ==================== -->
  <g>
    <!-- Rectangular Box -->
    <rect x="130" y="645" width="150" height="38" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
    <text x="205" y="669" font-size="14" font-weight="700" fill="#000000" text-anchor="middle">Material</text>
    
    <!-- Diagonal Main Bone -->
    <line x1="205" y1="645" x2="350" y2="370" stroke="#000000" stroke-width="2.5" marker-end="url(#arrow-bone)"/>

    <!-- Sub-branches -->
    <line x1="45" y1="600" x2="228" y2="600" stroke="#000000" stroke-width="1.4" marker-end="url(#arrow-sub)"/>
    <text x="50" y="593" font-size="11" font-weight="500" fill="#000000">Total scarcity of published baseline air data</text>

    <line x1="70" y1="545" x2="257" y2="545" stroke="#000000" stroke-width="1.4" marker-end="url(#arrow-sub)"/>
    <text x="75" y="538" font-size="11" font-weight="500" fill="#000000">Low-cost sensor baseline drift (MQ-135)</text>

    <line x1="90" y1="490" x2="286" y2="490" stroke="#000000" stroke-width="1.4" marker-end="url(#arrow-sub)"/>
    <text x="95" y="483" font-size="11" font-weight="500" fill="#000000">Wear of laser diodes &amp; heated elements</text>

    <line x1="110" y1="435" x2="315" y2="435" stroke="#000000" stroke-width="1.4" marker-end="url(#arrow-sub)"/>
    <text x="115" y="428" font-size="11" font-weight="500" fill="#000000">Enclosure vulnerability to outdoor exposure</text>
  </g>

  <!-- ==================== 5. MILIEU (BOTTOM-MIDDLE) ==================== -->
  <g>
    <!-- Rectangular Box -->
    <rect x="430" y="645" width="150" height="38" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
    <text x="505" y="669" font-size="14" font-weight="700" fill="#000000" text-anchor="middle">Milieu</text>
    
    <!-- Diagonal Main Bone -->
    <line x1="505" y1="645" x2="650" y2="370" stroke="#000000" stroke-width="2.5" marker-end="url(#arrow-bone)"/>

    <!-- Sub-branches -->
    <line x1="345" y1="600" x2="528" y2="600" stroke="#000000" stroke-width="1.4" marker-end="url(#arrow-sub)"/>
    <text x="350" y="593" font-size="11" font-weight="500" fill="#000000">High tropical relative humidity (>75% RH)</text>

    <line x1="370" y1="545" x2="557" y2="545" stroke="#000000" stroke-width="1.4" marker-end="url(#arrow-sub)"/>
    <text x="375" y="538" font-size="11" font-weight="500" fill="#000000">Hygroscopic moisture swelling of particles</text>

    <line x1="390" y1="490" x2="586" y2="490" stroke="#000000" stroke-width="1.4" marker-end="url(#arrow-sub)"/>
    <text x="395" y="483" font-size="11" font-weight="500" fill="#000000">Coastal airborne sea-salt aerosols &amp; rust</text>

    <line x1="410" y1="435" x2="615" y2="435" stroke="#000000" stroke-width="1.4" marker-end="url(#arrow-sub)"/>
    <text x="415" y="428" font-size="11" font-weight="500" fill="#000000">Tropical torrential rainfall &amp; heat</text>
  </g>

  <!-- ==================== 6. MEASUREMENT (BOTTOM-RIGHT) ==================== -->
  <g>
    <!-- Rectangular Box -->
    <rect x="730" y="645" width="150" height="38" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
    <text x="805" y="669" font-size="14" font-weight="700" fill="#000000" text-anchor="middle">Measurement</text>
    
    <!-- Diagonal Main Bone -->
    <line x1="805" y1="645" x2="930" y2="370" stroke="#000000" stroke-width="2.5" marker-end="url(#arrow-bone)"/>

    <!-- Sub-branches -->
    <line x1="645" y1="600" x2="825" y2="600" stroke="#000000" stroke-width="1.4" marker-end="url(#arrow-sub)"/>
    <text x="650" y="593" font-size="11" font-weight="500" fill="#000000">Lack of local reference units for calibration</text>

    <line x1="670" y1="545" x2="850" y2="545" stroke="#000000" stroke-width="1.4" marker-end="url(#arrow-sub)"/>
    <text x="675" y="538" font-size="11" font-weight="500" fill="#000000">Unfiltered ADC electrical noise &amp; sensor spikes</text>

    <line x1="695" y1="490" x2="875" y2="490" stroke="#000000" stroke-width="1.4" marker-end="url(#arrow-sub)"/>
    <text x="700" y="483" font-size="11" font-weight="500" fill="#000000">Discrepancy with DENR DAO 2000-81 breakpoints</text>

    <line x1="720" y1="435" x2="900" y2="435" stroke="#000000" stroke-width="1.4" marker-end="url(#arrow-sub)"/>
    <text x="725" y="428" font-size="11" font-weight="500" fill="#000000">Absence of empirical model validation metrics</text>
  </g>

  <!-- ==================== FISH HEAD (TRIANGLE POINTING RIGHT) ==================== -->
  <!-- Triangle base at x=965, pointing right to apex at x=1270 -->
  <polygon points="965,230 1270,370 965,510" fill="#FFFFFF" stroke="#000000" stroke-width="2.5"/>

  <!-- Problem Statement Inside Triangle -->
  <text x="1005" y="325" font-size="13" font-weight="700" fill="#000000" text-anchor="start">Lack of</text>
  <text x="1005" y="348" font-size="13" font-weight="700" fill="#000000" text-anchor="start">Localized</text>
  <text x="1005" y="371" font-size="13" font-weight="700" fill="#000000" text-anchor="start">Air Quality</text>
  <text x="1005" y="394" font-size="13" font-weight="700" fill="#000000" text-anchor="start">Monitoring in</text>
  <text x="1005" y="417" font-size="13" font-weight="700" fill="#000000" text-anchor="start">Borongan City</text>

</svg>
