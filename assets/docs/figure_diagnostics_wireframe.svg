  <rect x="915" y="254" width="190" height="62" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
  <text x="1010" y="270" font-size="8.5" font-weight="700" fill="#64748B" text-anchor="middle">AGGREGATE DATA STATS</text>
  <text x="1010" y="288" font-size="11" font-weight="800" fill="#0F172A" text-anchor="middle">Min: 0 | Max: 496</text>
  <text x="1010" y="306" font-size="10.5" font-weight="700" fill="#64748B" text-anchor="middle">14,565+ Raw Readings</text>

