  <text x="190" y="270" font-size="8.5" font-weight="700" fill="#64748B" text-anchor="middle">TODAY'S AVERAGE</text>
  <text x="190" y="296" font-size="22" font-weight="800" fill="#0F172A" text-anchor="middle">9.7 AQI</text>
  <text x="190" y="310" font-size="8.5" font-weight="700" fill="#64748B" text-anchor="middle">Category: Good</text>

  <!-- Metric 2: Yesterday's Avg -->
  <rect x="300" y="254" width="190" height="62" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
