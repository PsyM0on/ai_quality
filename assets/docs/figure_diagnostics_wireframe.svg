  <circle cx="88" cy="85" r="4.5" fill="#CBD5E1" stroke="#0F172A" stroke-width="1"/>
  <circle cx="104" cy="85" r="4.5" fill="#CBD5E1" stroke="#0F172A" stroke-width="1"/>
  <rect x="130" y="76" width="340" height="18" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
  <text x="140" y="89" font-size="10" font-family="monospace" fill="#64748B">https://eco-quality.duckdns.org/dashboard.php?view=technical</text>

  <!-- Top Navigation Bar -->
  <line x1="50" y1="156" x2="1150" y2="156" stroke="#E2E8F0" stroke-width="1.5"/>
  
  <!-- Brand -->
  <rect x="75" y="116" width="26" height="26" rx="5" fill="#E2E8F0" stroke="#0F172A" stroke-width="1.5"/>
  <text x="110" y="134" font-size="15" font-weight="800" fill="#0F172A">Eco Quality</text>
  <text x="195" y="134" font-size="9" font-weight="600" fill="#64748B" letter-spacing="0.05em">DIAGNOSTICS CONSOLE</text>

  <!-- Segmented Switcher (Diagnostics is Active) -->
  <rect x="475" y="114" width="250" height="30" rx="6" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="538" y="133" font-size="11" font-weight="600" fill="#64748B" text-anchor="middle">Overview</text>
  <rect x="602" y="116" width="121" height="26" rx="5" fill="#0F172A" stroke="#0F172A" stroke-width="1.2"/>
  <text x="662" y="133" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">Diagnostics</text>

  <!-- Right Controls -->
  <rect x="980" y="115" width="28" height="28" rx="5" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
  <circle cx="994" cy="129" r="6" fill="none" stroke="#0F172A" stroke-width="1.2"/>
  <rect x="1018" y="115" width="28" height="28" rx="5" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="1032" y="133" font-size="14" font-weight="700" fill="#0F172A" text-anchor="middle">↻</text>
  <rect x="1056" y="115" width="68" height="28" rx="5" fill="#FFFFFF" stroke="#0F172A" stroke-width="1.2"/>
  <text x="1090" y="133" font-size="10.5" font-weight="700" fill="#0F172A" text-anchor="middle">CSV Export</text>

