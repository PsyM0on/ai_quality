  <text x="805" y="296" font-size="22" font-weight="800" fill="#0F172A" text-anchor="middle">28.8 AQI</text>
  <text x="805" y="310" font-size="8.5" font-weight="700" fill="#64748B" text-anchor="middle">Category: Good</text>

