  <rect x="75" y="342" width="1050" height="195" rx="8" fill="#FFFFFF" stroke="#0F172A" stroke-width="1.5"/>
  
  <!-- Chart Header & Series Toggles -->
  <text x="95" y="364" font-size="11" font-weight="800" fill="#64748B" letter-spacing="0.05em">MULTI-PARAMETRIC SENSOR HISTORY TIMELINE</text>
  
  <rect x="680" y="352" width="60" height="18" rx="3" fill="#0F172A"/>
  <text x="710" y="365" font-size="8.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">✓ PM10</text>
  <rect x="750" y="352" width="60" height="18" rx="3" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1"/>
