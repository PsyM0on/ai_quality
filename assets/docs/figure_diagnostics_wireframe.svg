  <text x="110" y="713" font-size="10" font-weight="800" fill="#0F172A">EMPIRICAL VALIDATION: R² = 0.9981 | MAE = 1.36 AQI Points</text>
  <text x="110" y="729" font-size="9" fill="#64748B">+84.6% error reduction over Linear Regression baseline (p &lt; 0.001)</text>

  <!-- Right Column: Isolation Forest & Z-Score Explainability -->
  <rect x="605" y="550" width="520" height="205" rx="8" fill="#FFFFFF" stroke="#0F172A" stroke-width="1.5"/>
  <text x="625" y="572" font-size="11" font-weight="800" fill="#64748B" letter-spacing="0.05em">HYBRID ISOLATION FOREST ANOMALY CENTER</text>
  
