  <rect x="95" y="604" width="460" height="8" rx="4" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1"/>
  <rect x="95" y="604" width="163" height="8" rx="4" fill="#0F172A"/>

  <!-- Bar 2: Rolling 1-Hour Average -->
  <text x="95" y="630" font-size="9.5" font-weight="700" fill="#0F172A">Rolling 1-Hour AQI Average</text>
  <text x="555" y="630" font-size="9.5" font-weight="700" fill="#0F172A" text-anchor="end">22.8%</text>
  <rect x="95" y="636" width="460" height="8" rx="4" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1"/>
  <rect x="95" y="636" width="105" height="8" rx="4" fill="#0F172A"/>

  <!-- Bar 3: Temperature -->
  <text x="95" y="662" font-size="9.5" font-weight="700" fill="#0F172A">Ambient Temperature (DHT22)</text>
  <text x="555" y="662" font-size="9.5" font-weight="700" fill="#0F172A" text-anchor="end">16.2%</text>
  <rect x="95" y="668" width="460" height="8" rx="4" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1"/>
  <rect x="95" y="668" width="75" height="8" rx="4" fill="#0F172A"/>

  <!-- Model Accuracy Callout Strip -->
