  <text x="963" y="670" font-size="8" font-weight="700" fill="#64748B" text-anchor="middle">Z(MQ135)</text>
  <text x="963" y="688" font-size="12" font-weight="800" fill="#0F172A" text-anchor="middle">+0.12σ</text>

  <!-- Tile 5 -->
  <rect x="1015" y="656" width="90" height="42" rx="4" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
  <text x="1060" y="670" font-size="8" font-weight="700" fill="#64748B" text-anchor="middle">Z(AQI)</text>
  <text x="1060" y="688" font-size="12" font-weight="800" fill="#0F172A" text-anchor="middle">+0.38σ</text>

  <!-- Bottom Explanatory Caption -->
  <text x="625" y="726" font-size="8.5" fill="#64748B">Explainability: Z-scores isolate true environmental pollution from hardware sensor faults.</text>
</svg>
