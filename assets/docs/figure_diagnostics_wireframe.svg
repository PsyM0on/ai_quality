  <text x="415" y="192" font-size="10.5" font-weight="600" fill="#64748B" text-anchor="middle">Machine Learning &amp; Anomaly Center</text>
  <rect x="545" y="174" width="160" height="28" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
  <text x="625" y="192" font-size="10.5" font-weight="600" fill="#64748B" text-anchor="middle">Sensor Site Map (GIS)</text>

