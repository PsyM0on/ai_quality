  <text x="595" y="520" font-size="9" fill="#64748B">12:00 PM (Noon Rush)</text>
  <text x="845" y="520" font-size="9" fill="#64748B">06:00 PM (Evening Rush)</text>
  <text x="1080" y="520" font-size="9" fill="#64748B">Current</text>

