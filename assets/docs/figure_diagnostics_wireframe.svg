  <text x="50" y="50" font-size="11.5" font-weight="500" fill="#64748B">Planned Architecture for Longitudinal Analytics, Random Forest Feature Weights, and Isolation Forest Anomaly Detection</text>

  <!-- Main Browser Frame -->
  <rect x="50" y="68" width="1100" height="705" rx="8" fill="#FFFFFF" stroke="#0F172A" stroke-width="2" filter="url(#diag-shadow)"/>
  
  <!-- Browser Window Top Header Bar -->
  <path d="M 50 68 L 1150 68 Q 1150 68 1150 76 L 1150 102 L 50 102 Z" fill="#F8FAFC" stroke="#0F172A" stroke-width="1.5"/>
