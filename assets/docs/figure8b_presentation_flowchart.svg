<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 820" width="100%" height="100%" style="background:#ffffff; font-family:'Segoe UI', Arial, sans-serif;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#000000"/>
    </marker>
  </defs>

  <!-- Title Banner -->
  <text x="320" y="28" font-size="14" font-weight="800" fill="#000000" text-anchor="middle" letter-spacing="0.03em">FIGURE 8B. PRESENTATION, USER ACCESS &amp; SYSTEM CONTROL</text>
  <text x="320" y="46" font-size="10.5" font-weight="500" fill="#64748B" text-anchor="middle">Part 2: Dashboard Synchronization, Admin C2 Console, &amp; Continuous Loop</text>

  <!-- OFF-PAGE CONNECTOR INPUT (PENTAGON POINTING DOWN) -->
  <g transform="translate(295, 66)">
    <polygon points="0,0 50,0 50,22 25,44 0,22" fill="#FFFFFF" stroke="#000000" stroke-width="2.2"/>
    <text x="25" y="19" font-size="14" font-weight="800" fill="#000000" text-anchor="middle">A</text>
  </g>
  <text x="360" y="90" font-size="10.5" font-weight="600" fill="#475569">From Figure 8A (Part 1)</text>

  <line x1="320" y1="110" x2="320" y2="134" stroke="#000000" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Synchronize Dashboard I/O Parallelogram -->
  <polygon points="170,134 500,134 450,192 120,192" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
  <text x="310" y="156" font-size="11" font-weight="700" fill="#000000" text-anchor="middle">Synchronize Web &amp; Mobile Dashboard</text>
  <text x="310" y="172" font-size="9.5" fill="#475569" text-anchor="middle">Real-Time Gauges, 3-Hour Forecasts, Chart.js History</text>
  <text x="310" y="185" font-size="9" fill="#64748B" text-anchor="middle">Automatic 5-second AJAX polling</text>

  <line x1="310" y1="192" x2="310" y2="218" stroke="#000000" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- User / Admin Interaction Decision -->
  <polygon points="310,218 450,268 310,318 170,268" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
  <text x="310" y="263" font-size="10.5" font-weight="700" fill="#000000" text-anchor="middle">User / Admin</text>
  <text x="310" y="278" font-size="10.5" font-weight="700" fill="#000000" text-anchor="middle">Action Request?</text>

  <!-- Left Branch: CSV Export -->
  <line x1="170" y1="268" x2="70" y2="268" stroke="#000000" stroke-width="2"/>
  <line x1="70" y1="268" x2="70" y2="330" stroke="#000000" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="75" y="260" font-size="9.5" font-weight="700" fill="#000000">CSV Export</text>

  <!-- Sub-Process Box: Export -->
  <rect x="20" y="330" width="100" height="42" fill="#FFFFFF" stroke="#000000" stroke-width="1.8"/>
  <line x1="28" y1="330" x2="28" y2="372" stroke="#000000" stroke-width="1.5"/>
  <line x1="112" y1="330" x2="112" y2="372" stroke="#000000" stroke-width="1.5"/>
  <text x="70" y="348" font-size="9" font-weight="700" fill="#000000" text-anchor="middle">Export AQI</text>
  <text x="70" y="362" font-size="9" font-weight="700" fill="#000000" text-anchor="middle">History (Fig 9)</text>

  <line x1="70" y1="372" x2="70" y2="400" stroke="#000000" stroke-width="2"/>

  <!-- Off-page connector B to Figure 9 -->
  <g transform="translate(45, 400)">
    <polygon points="0,0 50,0 50,22 25,44 0,22" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
    <text x="25" y="19" font-size="13" font-weight="800" fill="#000000" text-anchor="middle">B</text>
  </g>
  <text x="70" y="460" font-size="8.5" fill="#64748B" text-anchor="middle">To Figure 9</text>

  <!-- Right Branch: Admin C2 Access -->
  <line x1="450" y1="268" x2="540" y2="268" stroke="#000000" stroke-width="2"/>
  <line x1="540" y1="268" x2="540" y2="330" stroke="#000000" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="460" y="260" font-size="9.5" font-weight="700" fill="#000000">Admin Login</text>

  <!-- Process Box: Admin C2 -->
  <rect x="460" y="330" width="160" height="54" fill="#FFFFFF" stroke="#000000" stroke-width="1.8"/>
  <text x="540" y="348" font-size="9.5" font-weight="700" fill="#000000" text-anchor="middle">Admin C2 Management</text>
  <text x="540" y="362" font-size="8.5" fill="#475569" text-anchor="middle">Auth, Rate-Limit Check</text>
  <text x="540" y="374" font-size="8.5" fill="#475569" text-anchor="middle">Queue Remote Node Cmds</text>

  <line x1="540" y1="384" x2="540" y2="480" stroke="#000000" stroke-width="2"/>
  <line x1="540" y1="480" x2="310" y2="480" stroke="#000000" stroke-width="2"/>

  <!-- Center Branch: Citizen Monitoring (Default) -->
  <line x1="310" y1="318" x2="310" y2="350" stroke="#000000" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="320" y="338" font-size="9.5" font-weight="700" fill="#000000">Live View</text>

  <rect x="210" y="350" width="200" height="44" fill="#FFFFFF" stroke="#000000" stroke-width="1.8"/>
  <text x="310" y="368" font-size="10" font-weight="700" fill="#000000" text-anchor="middle">Citizen Live View Active</text>
  <text x="310" y="384" font-size="9" fill="#475569" text-anchor="middle">Advisory &amp; Forecast Observation</text>

  <line x1="310" y1="394" x2="310" y2="505" stroke="#000000" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Return from Export (Connector A return line) -->
  <g transform="translate(45, 480)">
    <circle cx="25" cy="25" r="16" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
    <text x="25" y="30" font-size="13" font-weight="800" fill="#000000" text-anchor="middle">A*</text>
  </g>
  <text x="70" y="525" font-size="8.5" fill="#64748B" text-anchor="middle">From Fig 9</text>
  <line x1="70" y1="535" x2="70" y2="555" stroke="#000000" stroke-width="2"/>
  <line x1="70" y1="555" x2="310" y2="555" stroke="#000000" stroke-width="2"/>

  <!-- Loop Decision Diamond -->
  <polygon points="310,505 450,555 310,605 170,555" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
  <text x="310" y="550" font-size="10.5" font-weight="700" fill="#000000" text-anchor="middle">Continuous</text>
  <text x="310" y="565" font-size="10.5" font-weight="700" fill="#000000" text-anchor="middle">Monitoring Active?</text>

  <!-- No Branch: Shutdown -->
  <line x1="310" y1="605" x2="310" y2="640" stroke="#000000" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="320" y="625" font-size="10" font-weight="700" fill="#000000">No</text>

  <rect x="220" y="640" width="180" height="38" rx="19" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
  <text x="310" y="664" font-size="11.5" font-weight="700" fill="#000000" text-anchor="middle">END: Safe Shutdown</text>

  <!-- Yes Branch: Return to 5-Min Cycle -->
  <line x1="450" y1="555" x2="570" y2="555" stroke="#000000" stroke-width="2"/>
  <line x1="570" y1="555" x2="570" y2="700" stroke="#000000" stroke-width="2"/>
  <text x="470" y="547" font-size="10" font-weight="700" fill="#000000">Yes (5-Min Cycle)</text>

  <line x1="570" y1="700" x2="340" y2="700" stroke="#000000" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ON-PAGE RETURN CONNECTOR CIRCLE -->
  <g transform="translate(290, 680)">
    <circle cx="20" cy="20" r="20" fill="#FFFFFF" stroke="#000000" stroke-width="2.2"/>
    <text x="20" y="26" font-size="14" font-weight="800" fill="#000000" text-anchor="middle">C</text>
  </g>
  <text x="310" y="730" font-size="10" font-weight="600" fill="#475569" text-anchor="middle">Loop back to ESP32 Sampling</text>
  <text x="310" y="744" font-size="9" fill="#64748B" text-anchor="middle">(Wait 5-Min Interval)</text>
</svg>
